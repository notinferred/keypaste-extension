<!DOCTYPE html>
<html lang="en">
  <head>
    <title data-i18n="popupTitle"></title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/page.css">
    <link rel="stylesheet" href="popup.css">
    <script src="../common/browser-polyfill.min.js"></script>
    <script src="../common/global.js"></script>
    <script src="popup_functions.js"></script>
    <script defer src="popup.js"></script>
    <script defer src="../common/translate.js"></script>
  </head>
  <body>
    <header id="settings" class="bar">
      <h1><span id="state"></span><span id="state-detail"></span></h1>
      <button id="lock-database-button" class="button quiet concealed" type="button" data-i18n="[title]lockDatabase">
        <!-- Lucide lock, ISC -->
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
      <button id="options-button" class="button quiet" type="button" data-i18n="[title]popupSettingsText">
        <!-- Lucide settings, ISC -->
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>

    <main class="content" aria-live="polite">
      <p id="initial-state" class="waiting" data-i18n="popupCheckingStatus"></p>

      <section id="not-configured" hidden>
        <p id="pairing-failed" class="problem" hidden>
          <!-- Lucide triangle-alert, ISC -->
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span data-i18n="pairingFailed"></span>
        </p>
        <div class="actions">
          <button id="connect-button" class="button primary" type="button" data-i18n="popupConnectButton"></button>
        </div>
      </section>

      <section id="need-reconfigure" hidden>
        <p data-i18n="popupNeedReconfigure"></p>
        <div class="actions">
          <button id="reconnect-button" class="button primary" type="button" data-i18n="popupReconnectButton"></button>
        </div>
      </section>

      <section id="checking-keypaste" class="pairing" hidden>
        <p id="pairing-code" class="pairing-code"></p>
        <p data-i18n="popupConfirmCode"></p>
        <p class="waiting" data-i18n="pairingWaiting"></p>
      </section>

      <section id="configured-and-associated" hidden>
        <p id="iframe-detected" class="info" hidden>
          <!-- Lucide info, ISC -->
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <span data-i18n="popupIframeDetected"></span>
        </p>
        <div class="actions">
          <button id="redetect-fields-button" class="button" type="button" data-i18n="[title]redetectButtonTitle">
            <span data-i18n="popupRedetectButton"></span>
          </button>
        </div>
        <p id="redetect-result" class="helper" role="status"></p>
      </section>

      <section id="keypaste-unreachable" hidden>
        <p data-i18n="popupGettingStartedText"></p>
        <div class="actions">
          <button class="button primary reload-status-button" type="button" data-i18n="[title]reloadButtonTitle">
            <span data-i18n="popupReloadButton"></span>
          </button>
        </div>
      </section>

      <section id="error-encountered" hidden>
        <p id="error-problem" class="problem">
          <!-- Lucide triangle-alert, ISC -->
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span data-i18n="popupErrorRetry"></span>
        </p>
        <div class="actions">
          <button class="button primary reload-status-button" type="button" data-i18n="[title]reloadButtonTitle">
            <span data-i18n="popupReloadButton"></span>
          </button>
        </div>
      </section>

      <section id="database-not-opened" hidden>
        <p data-i18n="errorMessageDatabaseNotOpened"></p>
        <div class="actions">
          <button id="reopen-database-button" class="button primary" type="button" data-i18n="[title]reopenDatabaseButtonTitle">
            <span data-i18n="loginListUnlock"></span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
